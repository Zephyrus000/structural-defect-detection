[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-defect-detection"
version = "0.1.0"
description = "Reproducible CNN-Swin semantic segmentation with persistent homology"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch>=2.6,<2.12", "torchvision>=0.21,<0.27",
  "numpy>=1.26,<3", "scipy>=1.12,<2", "Pillow>=10,<14",
  "PyYAML>=6,<7", "gudhi==3.11.0", "pycocotools>=2.0.8,<3", "filelock>=3,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
sdd = "structural_defect_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

