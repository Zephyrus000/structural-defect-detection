name: Train ML Model

on:
  push:
    branches: [main, cif-setting]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        id: python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-${{ runner.arch }}-pip-cpu-${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pip-cpu-${{ steps.python.outputs.python-version }}-

      - name: Install dependencies
        run: |
          python -m pip install torch==2.11.0+cpu torchvision==0.26.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . -r requirements.txt

      - name: Prepare CIF training data
        run: python .github/scripts/prepare_cif.py

      - name: Train model
        run: |
          python model.py --run-id training --output-root "$RUNNER_TEMP/studio7"
          cp .cache/cif-studio7/provenance.json "$RUNNER_TEMP/studio7/training/"

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-results
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/studio7/training/model_results.png
            ${{ runner.temp }}/studio7/training/metrics.txt
            ${{ runner.temp }}/studio7/training/history.json
            ${{ runner.temp }}/studio7/training/resolved.yaml
            ${{ runner.temp }}/studio7/training/data_report.json
            ${{ runner.temp }}/studio7/training/provenance.json
            ${{ runner.temp }}/studio7/training/checkpoints/best.pt
